[build-system]
requires = ["setuptools>=74.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skordinal"
version = "0.1.0rc1"
description = "Ordinal classification for Python, scikit-learn compatible"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "David Guijo-Rubio", email = "dguijo@uco.es"},
    {name = "Ángel Sevilla Molina", email = "asevilla@uco.es"},
    {name = "Víctor Manuel Vargas", email = "vvargas@uco.es"},
    {name = "Pedro A. Gutiérrez", email = "pagutierrez@uco.es"},
]
keywords = [
    "ordinal classification",
    "ordinal regression",
    "machine learning",
    "scikit-learn",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: C",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "scikit-learn>=1.6",
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.10",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-xdist[psutil]",
    "pytest-benchmark",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit",
]

[project.urls]
Homepage = "https://github.com/ayrna/skordinal"
Repository = "https://github.com/ayrna/skordinal"
"Bug Tracker" = "https://github.com/ayrna/skordinal/issues"

[tool.setuptools.packages.find]
include = [
    "skordinal",
    "skordinal.*",
]
exclude = ["*.tests"]
namespaces = false

[tool.setuptools.package-data]
"skordinal.datasets.data" = ["*.csv"]
"skordinal.datasets.descr" = ["*.rst"]
"skordinal.utils" = ["*.csv"]

[tool.setuptools]
ext-modules = [
    {name = "skordinal.classifiers._libsvmrank", language = "c++", sources = [
            "skordinal/classifiers/src/libsvmrank/python/svm-module.cpp",
            "skordinal/classifiers/src/libsvmrank/python/svm-train.cpp",
            "skordinal/classifiers/src/libsvmrank/python/svm-predict.cpp",
            "skordinal/classifiers/src/libsvmrank/python/svm-model-python.cpp",
            "skordinal/classifiers/src/libsvmrank/python/svm.cpp",
        ], extra-compile-args = ["-Wno-unused-result"]},
    {name = "skordinal.classifiers._libsvorex", language = "c", sources = [
            "skordinal/classifiers/src/svorex/svorex_module.c",
            "skordinal/classifiers/src/svorex/svorex_train.c",
            "skordinal/classifiers/src/svorex/svorex_predict.c",
            "skordinal/classifiers/src/svorex/alphas.c",
            "skordinal/classifiers/src/svorex/cachelist.c",
            "skordinal/classifiers/src/svorex/datalist.c",
            "skordinal/classifiers/src/svorex/def_settings.c",
            "skordinal/classifiers/src/svorex/loadfile.c",
            "skordinal/classifiers/src/svorex/ordinal_takestep.c",
            "skordinal/classifiers/src/svorex/setandfi.c",
            "skordinal/classifiers/src/svorex/smo_kernel.c",
            "skordinal/classifiers/src/svorex/smo_routine.c",
            "skordinal/classifiers/src/svorex/smo_settings.c",
            "skordinal/classifiers/src/svorex/smo_timer.c",
            "skordinal/classifiers/src/svorex/svc_predict.c",
            "skordinal/classifiers/src/svorex/smo_model_python.c",
            "skordinal/classifiers/src/svorex/smo_loadproblem_python.c",
            "skordinal/classifiers/src/svorex/smo_routine_python.c",
        ], extra-compile-args = ["-Wno-unused-result", "-ffp-contract=off", "-fvisibility=hidden"], libraries = ["m"]},
    {name = "skordinal.classifiers._libsvorim", language = "c", sources = [
            "skordinal/classifiers/src/svorim/svorim_module.c",
            "skordinal/classifiers/src/svorim/svorim_train.c",
            "skordinal/classifiers/src/svorim/svorim_predict.c",
            "skordinal/classifiers/src/svorim/alphas.c",
            "skordinal/classifiers/src/svorim/cachelist.c",
            "skordinal/classifiers/src/svorim/datalist.c",
            "skordinal/classifiers/src/svorim/def_settings.c",
            "skordinal/classifiers/src/svorim/loadfile.c",
            "skordinal/classifiers/src/svorim/ordinal_takestep.c",
            "skordinal/classifiers/src/svorim/setandfi.c",
            "skordinal/classifiers/src/svorim/smo_kernel.c",
            "skordinal/classifiers/src/svorim/smo_routine.c",
            "skordinal/classifiers/src/svorim/smo_settings.c",
            "skordinal/classifiers/src/svorim/smo_timer.c",
            "skordinal/classifiers/src/svorim/svc_predict.c",
            "skordinal/classifiers/src/svorim/smo_model_python.c",
            "skordinal/classifiers/src/svorim/smo_loadproblem_python.c",
            "skordinal/classifiers/src/svorim/smo_routine_python.c",
        ], extra-compile-args = ["-Wno-unused-result", "-ffp-contract=off", "-fvisibility=hidden"], libraries = ["m"]},
    {name = "skordinal.classifiers._orensemble", language = "c++", sources = [
            "skordinal/classifiers/src/orensemble/python/orensemble-module.cpp",
            "skordinal/classifiers/src/orensemble/python/orensemble-model-python.cpp",
            "skordinal/classifiers/src/orensemble/python/boostrank-train.cpp",
            "skordinal/classifiers/src/orensemble/python/boostrank-predict.cpp",
            "skordinal/classifiers/src/orensemble/python/train-functions.cpp",
            "skordinal/classifiers/src/orensemble/orensemble/aggrank.cpp",
            "skordinal/classifiers/src/orensemble/orensemble/orboost.cpp",
            "skordinal/classifiers/src/orensemble/orensemble/rankboost.cpp",
            "skordinal/classifiers/src/orensemble/orensemble/softperc.cpp",
            "skordinal/classifiers/src/orensemble/python/lemga-20060516/lemga/aggregating.cpp",
            "skordinal/classifiers/src/orensemble/python/lemga-20060516/lemga/feedforwardnn.cpp",
            "skordinal/classifiers/src/orensemble/python/lemga-20060516/lemga/kernel.cpp",
            "skordinal/classifiers/src/orensemble/python/lemga-20060516/lemga/learnmodel.cpp",
            "skordinal/classifiers/src/orensemble/python/lemga-20060516/lemga/nnlayer.cpp",
            "skordinal/classifiers/src/orensemble/python/lemga-20060516/lemga/object.cpp",
            "skordinal/classifiers/src/orensemble/python/lemga-20060516/lemga/perceptron.cpp",
            "skordinal/classifiers/src/orensemble/python/lemga-20060516/lemga/stump.cpp",
            "skordinal/classifiers/src/orensemble/python/lemga-20060516/lemga/utility.cpp",
            "skordinal/classifiers/src/orensemble/python/lemga-20060516/lemga/svm.cpp",
            "skordinal/classifiers/src/orensemble/python/lemga-20060516/lemga/quickfun.c",
            "skordinal/classifiers/src/orensemble/python/lemga-20060516/lemga/random.c",
            "skordinal/classifiers/src/orensemble/python/libsvm-2.81/svm.cpp",
        ], include-dirs = [
            "skordinal/classifiers/src/orensemble/orensemble",
            "skordinal/classifiers/src/orensemble/python",
            "skordinal/classifiers/src/orensemble/python/lemga-20060516/lemga",
            "skordinal/classifiers/src/orensemble/python/libsvm-2.81",
        ], extra-compile-args = ["-Wno-unused-result", "-Wno-deprecated-declarations", "-Wno-write-strings", "-fvisibility=hidden"]}
]

[tool.pytest.ini_options]
testpaths = ["skordinal"]
addopts = ["--color=yes", "--import-mode=importlib"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    ".eggs",
    ".git",
    ".mypy_cache",
    "__pycache__",
    "build",
    "dist",
    "skordinal/classifiers/src/libsvmrank/",
    "skordinal/classifiers/src/svorex/setup.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
allow_redefinition = true
exclude = ["skordinal/classifiers/src/libsvmrank/", "skordinal/classifiers/src/svorex/", "skordinal/classifiers/src/svorim/"]

[tool.check-sdist]
git-only = [
    ".codecov.yml",
    ".coveragerc",
    ".gitignore",
    "doc/**",
    "examples/**",
    "skordinal/**/tests/**",
    "skordinal/testing/**",
    "skordinal/classifiers/src/libsvmrank/grid.py",
    "skordinal/classifiers/src/libsvmrank/svm-predict.c",
    "skordinal/classifiers/src/libsvmrank/svm-train.c",
    "skordinal/classifiers/src/libsvmrank/svm.cpp",
    "skordinal/classifiers/src/libsvmrank/Makefile",
    "skordinal/classifiers/src/libsvmrank/README",
    "skordinal/classifiers/src/libsvmrank/python/setup.py",
    "skordinal/classifiers/src/libsvmrank/python/makefile",
    "skordinal/classifiers/src/svorex/main.c",
    "skordinal/classifiers/src/svorex/Makefile",
    "skordinal/classifiers/src/svorex/README.svorex",
    "skordinal/classifiers/src/svorex/setup.py",
    "skordinal/classifiers/src/orensemble/python/lemga-20060516/lemga/LEMGA.dox",
    "skordinal/classifiers/src/orensemble/python/lemga-20060516/lemga/Makefile",
]
