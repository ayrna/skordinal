[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skordinal"
version = "0.2.0"
description = "Ordinal classification for Python, scikit-learn compatible"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    {name = "David Guijo-Rubio", email = "dguijo@uco.es"},
    {name = "Ángel Sevilla Molina", email = "asevilla@uco.es"},
    {name = "Víctor Manuel Vargas", email = "vvargas@uco.es"},
    {name = "Pedro A. Gutiérrez", email = "pagutierrez@uco.es"},
]
keywords = [
    "ordinal classification",
    "ordinal regression",
    "machine learning",
    "scikit-learn",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: C",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "scikit-learn>=1.6",
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.10",
    "joblib>=1.3",
]

[project.optional-dependencies]
progress = [
    "tqdm>=4.66",
]
dev = [
    "skordinal[progress]",
    "pytest>=7.0",
    "pytest-cov",
    "pytest-xdist[psutil]",
    "pytest-benchmark",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit",
]
docs = [
    "sphinx>=7",
    "pydata-sphinx-theme",
    "numpydoc",
    "sphinx-gallery>=0.19",
    "matplotlib",
]

[project.urls]
Homepage = "https://github.com/ayrna/skordinal"
Documentation = "https://skordinal.readthedocs.io"
Repository = "https://github.com/ayrna/skordinal"
"Bug Tracker" = "https://github.com/ayrna/skordinal/issues"

[tool.setuptools.packages.find]
include = [
    "skordinal",
    "skordinal.*",
]
exclude = ["*.tests"]
namespaces = false

[tool.setuptools.package-data]
"skordinal.datasets.data" = ["*.csv"]
"skordinal.datasets.descr" = ["*.rst"]
"skordinal.utils" = ["*.csv"]

[tool.setuptools]
ext-modules = [
    {name = "skordinal.svm._libsvmrank", language = "c++", sources = [
            "skordinal/svm/src/libsvmrank/python/svm-module.cpp",
            "skordinal/svm/src/libsvmrank/python/svm-train.cpp",
            "skordinal/svm/src/libsvmrank/python/svm-predict.cpp",
            "skordinal/svm/src/libsvmrank/python/svm-model-python.cpp",
            "skordinal/svm/src/libsvmrank/python/svm.cpp",
        ], extra-compile-args = ["-Wno-unused-result"]},
    {name = "skordinal.svm._libsvor", language = "c", sources = [
            "skordinal/svm/src/svor/svor_module.c",
            "skordinal/svm/src/svor/svor_train.c",
            "skordinal/svm/src/svor/svor_predict.c",
            "skordinal/svm/src/svor/alphas.c",
            "skordinal/svm/src/svor/cachelist.c",
            "skordinal/svm/src/svor/datalist.c",
            "skordinal/svm/src/svor/def_settings.c",
            "skordinal/svm/src/svor/loadfile.c",
            "skordinal/svm/src/svor/ordinal_takestep.c",
            "skordinal/svm/src/svor/setandfi.c",
            "skordinal/svm/src/svor/smo_kernel.c",
            "skordinal/svm/src/svor/smo_routine.c",
            "skordinal/svm/src/svor/smo_settings.c",
            "skordinal/svm/src/svor/smo_timer.c",
            "skordinal/svm/src/svor/svc_predict.c",
            "skordinal/svm/src/svor/smo_model_python.c",
            "skordinal/svm/src/svor/smo_loadproblem_python.c",
            "skordinal/svm/src/svor/smo_routine_python.c",
        ], extra-compile-args = ["-Wno-unused-result", "-ffp-contract=off", "-fvisibility=hidden"], libraries = ["m"]},
    {name = "skordinal.ensemble._orensemble", language = "c++", sources = [
            "skordinal/ensemble/src/orensemble/python/orensemble-module.cpp",
            "skordinal/ensemble/src/orensemble/python/orensemble-model-python.cpp",
            "skordinal/ensemble/src/orensemble/python/boostrank-train.cpp",
            "skordinal/ensemble/src/orensemble/python/boostrank-predict.cpp",
            "skordinal/ensemble/src/orensemble/python/train-functions.cpp",
            "skordinal/ensemble/src/orensemble/orensemble/aggrank.cpp",
            "skordinal/ensemble/src/orensemble/orensemble/orboost.cpp",
            "skordinal/ensemble/src/orensemble/orensemble/rankboost.cpp",
            "skordinal/ensemble/src/orensemble/orensemble/softperc.cpp",
            "skordinal/ensemble/src/orensemble/python/lemga-20060516/lemga/aggregating.cpp",
            "skordinal/ensemble/src/orensemble/python/lemga-20060516/lemga/feedforwardnn.cpp",
            "skordinal/ensemble/src/orensemble/python/lemga-20060516/lemga/kernel.cpp",
            "skordinal/ensemble/src/orensemble/python/lemga-20060516/lemga/learnmodel.cpp",
            "skordinal/ensemble/src/orensemble/python/lemga-20060516/lemga/nnlayer.cpp",
            "skordinal/ensemble/src/orensemble/python/lemga-20060516/lemga/object.cpp",
            "skordinal/ensemble/src/orensemble/python/lemga-20060516/lemga/perceptron.cpp",
            "skordinal/ensemble/src/orensemble/python/lemga-20060516/lemga/stump.cpp",
            "skordinal/ensemble/src/orensemble/python/lemga-20060516/lemga/utility.cpp",
            "skordinal/ensemble/src/orensemble/python/lemga-20060516/lemga/svm.cpp",
            "skordinal/ensemble/src/orensemble/python/lemga-20060516/lemga/quickfun.c",
            "skordinal/ensemble/src/orensemble/python/lemga-20060516/lemga/random.c",
            "skordinal/ensemble/src/orensemble/python/libsvm-2.81/svm.cpp",
        ], include-dirs = [
            "skordinal/ensemble/src/orensemble/orensemble",
            "skordinal/ensemble/src/orensemble/python",
            "skordinal/ensemble/src/orensemble/python/lemga-20060516/lemga",
            "skordinal/ensemble/src/orensemble/python/libsvm-2.81",
        ], extra-compile-args = ["-Wno-unused-result", "-Wno-deprecated-declarations", "-Wno-write-strings", "-fvisibility=hidden"]}
]

[tool.pytest.ini_options]
testpaths = ["skordinal"]
addopts = ["--color=yes", "--import-mode=importlib", "-m", "not network"]
markers = [
    "slow: benchmarks and long-running tests",
    "integration: end-to-end sklearn pipeline integration",
    "network: tests that require a live internet connection",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    ".eggs",
    ".git",
    ".mypy_cache",
    "__pycache__",
    "build",
    "dist",
    "skordinal/svm/src/libsvmrank/",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Gallery scripts interleave imports with prose blocks on purpose, so the
# reader meets each import where it is first used
"examples/**" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
allow_redefinition = true
exclude = ["skordinal/svm/src/libsvmrank/", "skordinal/svm/src/svor/"]

[tool.check-sdist]
git-only = [
    ".codecov.yml",
    ".coveragerc",
    ".gitignore",
    ".readthedocs.yaml",
    "docs/**",
    "examples/**",
    "skordinal/**/tests/**",
    "skordinal/svm/src/libsvmrank/grid.py",
    "skordinal/svm/src/libsvmrank/svm-predict.c",
    "skordinal/svm/src/libsvmrank/svm-train.c",
    "skordinal/svm/src/libsvmrank/svm.cpp",
    "skordinal/svm/src/libsvmrank/Makefile",
    "skordinal/svm/src/libsvmrank/README",
    "skordinal/svm/src/libsvmrank/python/setup.py",
    "skordinal/svm/src/libsvmrank/python/makefile",
    "skordinal/svm/src/svor/README.svorex",
    "skordinal/ensemble/src/orensemble/python/lemga-20060516/lemga/LEMGA.dox",
    "skordinal/ensemble/src/orensemble/python/lemga-20060516/lemga/Makefile",
]
